<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Malla de Turnos GRH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
<style>
:root{
  --ground:#F3F6FB; --surface:#FFFFFF; --surface-2:#EAEFF7; --surface-3:#DFE6F2;
  --line:#D9E1EF; --line-2:#BFCBE0;
  --ink:#121823; --ink-2:#4E5B72; --ink-3:#7A879E;
  --accent:#2B4C8C; --accent-2:#1B3568; --accent-soft:#E4ECFA; --accent-line:#B7C9EA; --on-accent:#FFFFFF;
  --ok:#0E6E50; --ok-soft:#DCF1E8; --warn:#8A5200; --warn-soft:#FAEBD3; --crit:#A32819; --crit-soft:#FAE3E0;
  --new:#5E3399; --new-soft:#EDE4FB; --new-line:#D2BDF0;
  --shadow:0 1px 2px rgba(18,30,56,.06), 0 6px 18px -8px rgba(18,30,56,.18);
  --r:10px;
  --font:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1218; --surface:#161C26; --surface-2:#1E2632; --surface-3:#28313F;
    --line:#2A3442; --line-2:#3B4759;
    --ink:#E8EDF6; --ink-2:#A3AFC3; --ink-3:#7C8AA1;
    --accent:#7FA4E8; --accent-2:#A9C3F3; --accent-soft:#1C2740; --accent-line:#31456B; --on-accent:#0E1218;
    --ok:#5FCCA5; --ok-soft:#13302A; --warn:#E0A64F; --warn-soft:#332615; --crit:#F09084; --crit-soft:#361D1A;
    --new:#BE9CF0; --new-soft:#241938; --new-line:#3D2C5C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1218; --surface:#161C26; --surface-2:#1E2632; --surface-3:#28313F;
  --line:#2A3442; --line-2:#3B4759;
  --ink:#E8EDF6; --ink-2:#A3AFC3; --ink-3:#7C8AA1;
  --accent:#7FA4E8; --accent-2:#A9C3F3; --accent-soft:#1C2740; --accent-line:#31456B; --on-accent:#0E1218;
  --ok:#5FCCA5; --ok-soft:#13302A; --warn:#E0A64F; --warn-soft:#332615; --crit:#F09084; --crit-soft:#361D1A;
  --new:#BE9CF0; --new-soft:#241938; --new-line:#3D2C5C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(145deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--on-accent);font-weight:700;font-size:13px;letter-spacing:.02em;flex:none}
.brand b{display:block;font-size:14px;letter-spacing:-.01em}
.brand span{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.11em;text-transform:uppercase;font-weight:600}
.nav{padding:10px 10px 24px;display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:16px 8px 6px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:8px;color:var(--ink-2);cursor:pointer;font-size:13.5px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .ic{width:16px;flex:none;opacity:.85;display:grid;place-items:center}
.nav .sub button{padding-left:34px;font-size:13px}
.nav .dot{width:5px;height:5px;border-radius:50%;background:var(--line-2);flex:none;margin-left:11px}
.nav button[aria-current="true"] .dot{background:var(--accent)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:11px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--ink-3);display:flex;gap:7px;align-items:center;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.chipbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.chipbtn:hover{border-color:var(--line-2);color:var(--ink)}
.chipbtn.on{background:var(--new-soft);border-color:var(--new-line);color:var(--new);font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:11px;flex:none;border:1px solid var(--accent-line)}
.who small{display:block;color:var(--ink-3);font-size:11px;line-height:1.2}
.view{padding:22px;max-width:1180px;width:100%}
.ph{margin-bottom:18px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ph h1{font-size:21px;letter-spacing:-.02em;font-weight:600}
.ph p{margin:4px 0 0;color:var(--ink-2);font-size:13px;max-width:66ch}
.ph .sp{flex:1}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card>header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>header h2{font-size:14px;font-weight:600;letter-spacing:-.01em}
.card>header .sp{flex:1}
.card .bd{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:5px;font-variant-numeric:tabular-nums}
.stat .m{font-size:12px;color:var(--ink-2);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--line-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-mut{background:var(--surface-2);color:var(--ink-2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.lbl{font-size:11.5px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:5px}
.fld{display:flex;flex-direction:column}
input[type=text],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
input[type=text]::placeholder{color:var(--ink-3)}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.sw{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .tr{width:34px;height:19px;border-radius:999px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+.tr{background:var(--accent)}
.sw input:checked+.tr::after{transform:translateX(15px)}
.sw input:focus-visible+.tr{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- change badges ---------- */
.chg{position:relative}
.tag{display:none;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.04em;padding:1.5px 6px;border-radius:5px;background:var(--new-soft);color:var(--new);border:1px solid var(--new-line);vertical-align:middle;white-space:nowrap;font-family:var(--mono)}
body.marks .tag{display:inline-flex}
body.marks .chg{outline:1.5px dashed var(--new-line);outline-offset:3px;border-radius:6px}
.gone{display:none;gap:8px;align-items:flex-start;padding:11px 13px;border:1px dashed var(--line-2);border-radius:9px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px}
body.marks .gone{display:flex}
.gone b{color:var(--ink)}
.gone .x{font-family:var(--mono);color:var(--crit);font-weight:700;flex:none}

/* ---------- operación ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.tc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.tc .hd{display:flex;gap:10px;align-items:center}
.tc .nm{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.tc .rl{font-size:11.5px;color:var(--ink-3)}
.tc .rw{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-top:1px dashed var(--line);padding-top:8px}
.tc .rw span:first-child{color:var(--ink-3)}
.tc .zs{display:flex;gap:5px;flex-wrap:wrap}
.zchip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.strip{width:3px;border-radius:3px;align-self:stretch;background:var(--accent)}

/* ---------- malla grid ---------- */
.mgrid{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.mgrid table{font-size:12.5px;min-width:760px}
.mgrid th,.mgrid td{padding:7px 8px;text-align:center;border-right:1px solid var(--line)}
.mgrid th:first-child,.mgrid td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;min-width:172px;border-right:1px solid var(--line-2)}
.mgrid th:first-child{background:var(--surface-2)}
.mgrid tbody tr:hover td:first-child{background:var(--surface-2)}
.cellc{display:inline-block;min-width:34px;padding:3px 6px;border-radius:6px;font-weight:600;font-size:11.5px;font-family:var(--mono)}
.t1{background:var(--accent-soft);color:var(--accent)}
.t2{background:var(--ok-soft);color:var(--ok)}
.t3{background:var(--warn-soft);color:var(--warn)}
.dsc{background:var(--surface-2);color:var(--ink-3)}
.vac{background:var(--new-soft);color:var(--new)}
.inc{background:var(--crit-soft);color:var(--crit)}
.wknd{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}

/* ---------- wizard ---------- */
.steps{display:flex;gap:0;flex-wrap:wrap;margin-bottom:18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.steps button{flex:1 1 150px;background:none;border:0;border-right:1px solid var(--line);padding:11px 13px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.steps button:last-child{border-right:0}
.steps .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-3);flex:none;font-family:var(--mono)}
.steps .tx{font-size:12.5px;color:var(--ink-2);min-width:0}
.steps button[aria-current="true"]{background:var(--accent-soft)}
.steps button[aria-current="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps button[aria-current="true"] .tx{color:var(--accent);font-weight:600}
.steps button.done .n{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.arow{display:flex;gap:10px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface);flex-wrap:wrap}
.arow .who2{display:flex;gap:9px;align-items:center;min-width:168px;flex:1 1 168px}
.arow .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.arow select{width:auto;min-width:118px}
.zonebox{display:none;gap:6px;align-items:center;flex-wrap:wrap}
.zonebox.show{display:flex}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.brk{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.brk .b{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}

.tl{display:flex;flex-direction:column;gap:0;padding-left:6px}
.tl .it{display:grid;grid-template-columns:16px 1fr;gap:12px;padding-bottom:14px;position:relative}
.tl .it::before{content:"";position:absolute;left:7px;top:16px;bottom:0;width:1.5px;background:var(--line)}
.tl .it:last-child::before{display:none}
.tl .bl{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);margin-top:2px}
.tl .it.ok .bl{border-color:var(--ok);background:var(--ok-soft)}
.tl .it.now .bl{border-color:var(--accent);background:var(--accent-soft)}
.tl .tt{font-size:13px;font-weight:600}
.tl .ts{font-size:12px;color:var(--ink-3)}
.notice{display:flex;gap:9px;padding:11px 13px;border-radius:9px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:12.5px;color:var(--accent)}
.notice b{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);align-items:center}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

.chglist{display:flex;flex-direction:column;gap:0}
.chgi{display:grid;grid-template-columns:42px 1fr auto;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:start}
.chgi:last-child{border-bottom:0}
.chgi .no{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-3);padding-top:2px}
.chgi .tt{font-size:13px;font-weight:500}
.chgi .ms{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.chgi .ms b{color:var(--ink-2);font-weight:600}

@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px}
  .nav .grp{display:none}
  .nav .sub button{padding-left:9px}
  .nav .dot{display:none}
  .view{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="mark">GA</div>
      <div><b>GRH Axiom</b><span>Malla de turnos</span></div>
    </div>
    <nav class="nav" id="nav">
      <button data-v="resumen" aria-current="true"><span class="ic">◧</span>Resumen</button>

      <div class="grp">Mi agenda</div>
      <div class="sub">
        <button data-v="agenda"><span class="dot"></span>Mi programación</button>
        <button data-v="cambio"><span class="dot"></span>Solicitar cambio</button>
      </div>

      <div class="grp">Operación</div>
      <div class="sub">
        <button data-v="operacion"><span class="dot"></span>Disponibilidad</button>
      </div>

      <div class="grp">Planificación</div>
      <div class="sub">
        <button data-v="mallas"><span class="dot"></span>Mallas de turnos</button>
        <button data-v="nueva"><span class="dot"></span>Nueva malla</button>
        <button data-v="solicitudes"><span class="dot"></span>Solicitudes de cambio</button>
        <button data-v="rotacion"><span class="dot"></span>Patrones y rotación</button>
      </div>

      <div class="grp">Configuración</div>
      <div class="sub">
        <button data-v="frentes"><span class="dot"></span>Frentes de operación</button>

        <button data-v="catalogos"><span class="dot"></span>Catálogos</button>
      </div>

      <div class="grp">Reportes</div>
      <div class="sub">
        <button data-v="reportes"><span class="dot"></span>Horas y novedades</button>
        <button data-v="auditoria"><span class="dot"></span>Auditoría</button>
      </div>

      <div class="grp">Sesión 11 sep</div>
      <div class="sub">
        <button data-v="cambios"><span class="dot"></span>Cambios aplicados</button>

    </nav>
  </aside>

  <div class="main">

      <div class="who"><div class="av">LJ</div><div><b>Laura Jiménez</b><small>Admin GRH</small></div></div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<script>
const T = {}; // vistas

/* ---------------- datos de ejemplo ---------------- */
const personas = [
  {n:"Laura Méndez",  d:"1090456789", c:"Agente",   ini:"LM", t:"T1", zonas:["Chapinero"], brk:["09:15","11:45"], mod:"Presencial"},
  {n:"Camilo Restrepo",d:"1090567890",c:"Agente",   ini:"CR", t:"T2", zonas:["Prado"], brk:["10:00","15:45"], mod:"Presencial"},
  {n:"Diana López",   d:"1091234567", c:"Agente",   ini:"DL", t:"T1", zonas:["Kennedy"], brk:["09:45","14:30"], mod:"Híbrido"},
  {n:"Andrés Peña",   d:"1092345678", c:"Analista", ini:"AP", t:"T3", zonas:["Soacha","Claret"], brk:["13:00"], mod:"Presencial"},
  {n:"Natalia Cruz",  d:"1093456789", c:"Agente",   ini:"NC", t:"T5", zonas:["Centro"], brk:["10:30","16:00"], mod:"Virtual"}
];
const turnos = {
  T1:{h:"06:00 – 14:00", n:"Turno 1 · Mañana", hrs:8},
  T2:{h:"14:00 – 22:00", n:"Turno 2 · Tarde", hrs:8},
  T3:{h:"09:00 – 18:00", n:"Turno 3 · Transversal", hrs:9},
  T5:{h:"08:00 – 17:00", n:"Turno 5 · Estándar", hrs:9}
};
const zonasCat = ["Chapinero","Prado","Fontibón","Claret","Kennedy","Soacha","Centro"];

function tag(n){return '<span class="tag">#'+n+'</span>';}
function pill(cls,txt){return '<span class="pill '+cls+'">'+txt+'</span>';}

/* ---------------- RESUMEN ---------------- */
T.resumen = ()=>`

  <div class="stat"><div class="k">Pantallas eliminadas</div><div class="v">5</div><div class="m">cobertura, cortes de nómina, reglas operativas, límite de intercambio, frente en modalidades</div></div>
  <div class="stat"><div class="k">Funciones nuevas</div><div class="v">7</div><div class="m">asignación por persona, zonas, breaks, roles, exportación</div></div>
  <div class="stat"><div class="k">Ajustes de diseño</div><div class="v">6</div><div class="m">filtros, vistas, tarjetas, códigos</div></div>
  <div class="stat"><div class="k">Por definir</div><div class="v">2</div><div class="m">franjas de recargo · estructura de zonas</div></div>
</div>
<section class="card"><header><h2>Detalle</h2></header><div class="bd"><div class="chglist">
${CAMBIOS.map(c=>`<div class="chgi">
  <div class="no">#${c[0]}</div>
  <div><div class="tt">${c[1]}</div><div class="ms"><b>${c[2]}</b> · solicita ${c[3]}</div></div>
  <div style="display:flex;gap:8px;align-items:center">
    ${pill(c[4]==='Eliminar'?'p-crit':c[4]==='Nuevo'?'p-acc':c[4]==='Se mantiene'?'p-ok':'p-mut',c[4])}
    <button class="btn sm" data-go="${c[5]}">Ver</button>
  </div>
</div>`).join('')}
</div></div></section>`;

/* ---------------- router ---------------- */
const titulos={resumen:["","Resumen"],agenda:["Mi agenda","Mi programación"],cambio:["Mi agenda","Solicitar cambio"],
 operacion:["Operación","Disponibilidad"],mallas:["Planificación","Malla operativa"],nueva:["Planificación","Nueva malla"],
 solicitudes:["Planificación","Solicitudes de cambio"],rotacion:["Planificación","Patrones y rotación"],
 frentes:["Configuración","Frentes de operación"],plantillas:["Configuración","Plantillas de turno"],catalogos:["Configuración","Catálogos"],
 reportes:["Reportes","Horas y novedades"],auditoria:["Reportes","Auditoría"],cambios:["Sesión 11 sep","Cambios aplicados"]};
const view=document.getElementById('view'), nav=document.getElementById('nav'), crumb=document.getElementById('crumb');

function go(v){
  if(!T[v]) v='resumen';
  view.innerHTML=T[v]();
  const t=titulos[v]||["","" ];
  crumb.innerHTML='<span>Malla de Turnos</span>'+(t[0]?' › <span>'+t[0]+'</span>':'')+' › <b>'+t[1]+'</b>';
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current', b.dataset.v===v?'true':'false'));
  window.scrollTo({top:0,behavior:'instant'});
  wire(v);
}
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-v]'); if(b) go(b.dataset.v);});

function wire(v){
  view.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  if(v==='operacion'){
    const g=document.getElementById('opGrid'), l=document.getElementById('opList'),
          bg=document.getElementById('vg'), bl=document.getElementById('vl');
    const set=grid=>{g.hidden=!grid;l.hidden=grid;bg.setAttribute('aria-pressed',grid);bl.setAttribute('aria-pressed',!grid);};
    bg.addEventListener('click',()=>set(true)); bl.addEventListener('click',()=>set(false));
  }
  if(v==='nueva'){
    view.querySelectorAll('.zck').forEach(c=>c.addEventListener('change',()=>document.getElementById('zb'+c.dataset.i).classList.toggle('show',c.checked)));
    view.querySelectorAll('.bck').forEach(c=>c.addEventListener('change',()=>document.getElementById('bb'+c.dataset.i).classList.toggle('show',c.checked)));
    view.querySelectorAll('#steps button').forEach(b=>b.addEventListener('click',()=>{
      view.querySelectorAll('#steps button').forEach(x=>x.setAttribute('aria-current','false'));
      b.setAttribute('aria-current','true');
    }));
  }
}
const mk=document.getElementById('mk');
mk.addEventListener('click',()=>{
  const on=document.body.classList.toggle('marks');
  mk.classList.toggle('on',on);
  mk.textContent=(on?'◆ ':'◇ ')+'Resaltar cambios';
});
go('resumen');
</script>

</body>
</html>
